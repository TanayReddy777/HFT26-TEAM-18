<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#06B6D4" stroke-width="6" opacity="0.4" filter="url(#glow)"/>

  <!-- Shield Shape -->
  <path d="M256 70 L96 130 V260 C96 360 164 450 256 480 C348 450 416 360 416 260 V130 Z" fill="url(#shield)"/>

  <!-- Inner Dark Core -->
  <path d="M256 100 L126 150 V255 C126 338 182 413 256 438 C330 413 386 338 386 255 V150 Z" fill="#0A0F1D" opacity="0.85"/>

  <!-- Emergency Red Beacon Center -->
  <circle cx="256" cy="260" r="54" fill="#EF4444" filter="url(#glow)"/>
  <circle cx="256" cy="260" r="32" fill="#FFFFFF"/>
</svg>
